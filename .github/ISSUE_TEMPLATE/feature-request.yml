name: 能力建议
description: 说明真实使用场景与预期行为
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前困难
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望增加的行为
      description: 可附 API 建议、替代方案和目标平台；同一组件的尺寸或颜色不单独计为新组件。
    validations:
      required: true
